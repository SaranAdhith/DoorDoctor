# Optional one-command startup:  docker compose up --build
# The application also runs without Docker - see README.md.
services:
  backend:
    build: ./backend
    container_name: doordoctor-backend
    environment:
      DATABASE_URL: sqlite:///./doordoc.db
      JWT_SECRET: change-this-in-development
      JWT_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    # Seed the demo database on first boot, then serve the API.
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: doordoctor-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
